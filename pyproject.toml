[project]
name = "amforge"
version = "0.1.0"
description = "AMForge — 端到端可微分增材制造仿真与数字化试验验证平台 (熔池CFD / 热力耦合 / 微观组织 / 均质化本构 / 刚柔多体数字样机)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "AMForge contributors" }]
keywords = [
    "additive-manufacturing",
    "selective-laser-melting",
    "differentiable-simulation",
    "jax",
    "finite-element",
    "digital-twin",
    "multi-objective-optimization",
    "inverse-design",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "optax>=0.2.2",
    "meshio>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0", "hatchling>=1.21"]
gui = ["PySide6>=6.5", "vtk>=9.2", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/amforge/amforge"
Documentation = "https://github.com/amforge/amforge#readme"
Repository = "https://github.com/amforge/amforge"

[project.scripts]
amforge = "amforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# forgecore 是 amforge.forge_adapter 的硬依赖（from forgecore.registry import ...），
# 必须与 amforge / diffmech 一起打进同一个 wheel，否则 `import amforge.forge_adapter`
# 会在纯 wheel 安装后失败。
packages = ["src/amforge", "src/diffmech", "src/forgecore"]

[tool.hatch.build.targets.sdist]
include = [
    "src/amforge",
    "src/diffmech",
    "src/forgecore",
    "tests",
    "README.md",
    "docs",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
